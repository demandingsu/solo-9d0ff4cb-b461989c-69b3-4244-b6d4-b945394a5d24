services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-answer-stats:local
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/answers.db
      SQLITE_BUSY_TIMEOUT_MS: "15000"
    volumes:
      - quiz-data:/data
    restart: unless-stopped

volumes:
  quiz-data:
